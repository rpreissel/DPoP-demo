  /orchestrator/api/v1/kc/channels/{channelSessionId}:
    patch:
      description: 'Upsert semantics (docs/05-api.md Abschnitt 3): creates the channel on first call under this Keycloak-chosen
        id, just resumes it on every later one - idempotent by construction, no separate create-then-resume round trip. accountId/targetAcr
        are only meaningful on step-up.'
      operationId: upsertChannel
      parameters:
      - in: path
        name: channelSessionId
        required: true
        schema:
          format: uuid
          type: string
      - in: header
        name: Authorization
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KcChannelUpsertRequest'
      responses:
        '200':
          content:
            application/json:
              example:
                channel:
                  channelSessionId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  state: REGISTERING
                next:
                  context: auth
                  step: selectMethod
                  type: orchestrator
                stepData:
                  kind: select-method
                  options:
                  - ident-fsc
                  - auth-password
              schema:
                $ref: '#/components/schemas/ChannelResponse'
          description: First call for a fresh Keycloak flow run - offers every kc-usable method.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Error. `error` names the case; its HTTP status is fixed per code (see ErrorResponse).
      security:
      - kc-peer-auth: [
          ]
      summary: Upsert a kc channel and advance its journey
      tags:
      - KC channels
  /orchestrator/api/v1/kc/channels/{channelSessionId}/restore-data:
    get:
      description: For the Authenticator's end-of-flow lifecycle hook only (docs/ideen/docs/05-api.md Abschnitt 3) - reads
        back what this channel accumulated, to stash in a Keycloak UserSessionModel note and resubmit at a later flow's start.
        kcSessionId is passed explicitly (not read off the channel's own anchor) because the returned token must remain valid
        across the flow-run boundary the channel itself does not survive - a fresh channel next flow run, but the very same
        UserSessionModel id.
      operationId: getRestoreData
      parameters:
      - in: path
        name: channelSessionId
        required: true
        schema:
          format: uuid
          type: string
      - in: query
        name: kcSessionId
        required: true
        schema:
          type: string
      - in: header
        name: Authorization
        required: false
        schema:
          type: string
      responses:
