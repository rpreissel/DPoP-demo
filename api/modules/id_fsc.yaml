components:
  schemas:
    IdentFscPatchRequest:
      properties:
        fsc:
          example: VALIDCODE
          type: string
        geburtsdatum:
          example: '1985-06-15'
          format: date
          type: string
        kvnr:
          example: A123456789
          type: string
        name:
          example: Muster
          type: string
        vorname:
          example: Max
          type: string
      type: object
  securitySchemes:
    dpop:
      description: DPoP proof JWT, one per request, bound to method and URL (docs/09-dpop.md). The App channel's proof; the
        binding key is derived from it and is never supplied by the caller.
      in: header
      name: DPoP
      type: apiKey
    kc-peer-auth:
      bearerFormat: JWT
      description: 'Signed peer-auth assertion (docs/05-api.md Abschnitt 3, ADR-7). The Web channel''s proof: Keycloak calls
        server-to-server, and the channel anchor comes out of the assertion.'
      scheme: bearer
      type: http
info:
  description: App-facing (orchestrator-first) API for the DPoP-bound registration and login demo. See docs/05-api.md for
    the full contract; the Keycloak-facing kc facade is out of scope for this build (docs/08-projektrahmen.md).
  title: DPoP-Demo Orchestrator API
  version: v1
openapi: 3.1.0
paths:
  /orchestrator/api/v1/channels/{channelSessionId}/tools/ident-fsc:
    post:
      description: 'No request body: toolId already carries kind and method.'
      operationId: activate
      parameters:
      - in: path
        name: channelSessionId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '201':
          content:
            application/json:
              example:
                channel:
                  channelSessionId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  state: REGISTERING
                next:
                  step: input
                  toolId: ident-fsc
                  toolSessionId: 9c858901-8a57-4791-81fe-4c455b099bc9
                  type: tool
              schema:
                $ref: ../openapi.yaml#/components/schemas/ChannelResponse
          description: Created
        default:
          content:
            application/json:
              schema:
                $ref: ../openapi.yaml#/components/schemas/ErrorResponse
          description: Error. `error` names the case; its HTTP status is fixed per code (see ErrorResponse).
      security:
      - dpop: [
          ]
      - kc-peer-auth: [
          ]
      summary: Activate ident-fsc
      tags:
      - 'Tool: Freischaltcode'
  /orchestrator/api/v1/tools/{toolSessionId}/ident-fsc:
    get:
      operationId: read
      parameters:
      - in: path
        name: toolSessionId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              example:
                channel:
                  channelSessionId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  state: REGISTERING
                next:
                  step: input
                  toolId: ident-fsc
                  toolSessionId: 9c858901-8a57-4791-81fe-4c455b099bc9
                  type: tool
              schema:
                $ref: ../openapi.yaml#/components/schemas/ChannelResponse
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: ../openapi.yaml#/components/schemas/ErrorResponse
          description: Error. `error` names the case; its HTTP status is fixed per code (see ErrorResponse).
      security:
      - dpop: [
          ]
      - kc-peer-auth: [
          ]
      summary: Read the current ident-fsc state
      tags:
      - 'Tool: Freischaltcode'
    patch:
      description: Only the fields being supplied or corrected need to be sent; all five together also resolves in one call.
      operationId: patch
      parameters:
      - in: path
        name: toolSessionId
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentFscPatchRequest'
      responses:
        '200':
          content:
            application/json:
              example:
                channel:
                  channelSessionId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  state: REGISTERING
                next:
                  context: enrollment
                  step: selectMethod
                  type: orchestrator
                stepData:
                  kind: select-method
                  options:
                  - enroll-sms
                  - enroll-device
              schema:
                $ref: ../openapi.yaml#/components/schemas/ChannelResponse
          description: Identified - the journey now chains toward the required loa2 (2nd factor + confirmed email).
        default:
          content:
            application/json:
              schema:
                $ref: ../openapi.yaml#/components/schemas/ErrorResponse
          description: Error. `error` names the case; its HTTP status is fixed per code (see ErrorResponse).
      security:
      - dpop: [
          ]
      - kc-peer-auth: [
          ]
      summary: Supply KVNR/name/vorname/geburtsdatum/FSC
      tags:
      - 'Tool: Freischaltcode'
tags:
- description: 'SMS-TAN: Einrichtung als Faktor, Anmeldung und Login ohne DPoP'
  name: 'Tool: SMS'
- description: Gerätebindung über den externen Dienstleister KOBIL
  name: 'Tool: KOBIL'
- description: KVNR/name/vorname/geburtsdatum/FSC identification
  name: 'Tool: Freischaltcode'
- description: 'Geraetebindung: Einrichtung und Anmeldung ueber den Geraeteschluessel'
  name: 'Tool: Gerät'
- description: 'Passwort: Einrichtung als Wissensfaktor, Anmeldung und Login ohne DPoP'
  name: 'Tool: Passwort'
- description: 'E-Mail: Bestaetigung der Adresse, Anmeldung und Login ohne DPoP'
  name: 'Tool: E-Mail'
- description: 'QR-Pairing: Freigabe eines Web-Kanals aus einer bereits angemeldeten App'
  name: 'Tool: QR-Login'
