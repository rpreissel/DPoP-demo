components:
  schemas:
    KobilActivateRequest:
      properties:
        activationCode:
          type: string
        pin:
          type: string
        tenantId:
          type: string
        userId:
          type: string
      required:
      - activationCode
      - pin
      - tenantId
      - userId
      type: object
    KobilLoginRequest:
      properties:
        pin:
          type: string
        tenantId:
          type: string
        userId:
          type: string
      required:
      - pin
      - tenantId
      - userId
      type: object
    KobilOtpResponse:
      properties:
        otp:
          type: string
      required:
      - otp
      type: object
    KobilRiskSimulationRequest:
      properties:
        risks:
          items:
            enum:
            - ROOTED
            - EMULATOR
            - DEBUGGER_ATTACHED
            - APP_TAMPERED
            - OS_OUTDATED
            type: string
          type: array
        tenantId:
          type: string
        userId:
          type: string
      required:
      - risks
      - tenantId
      - userId
      type: object
  securitySchemes:
    dpop:
      description: DPoP proof JWT (docs/09-dpop.md); required on every App-facade call.
      in: header
      name: DPoP
      type: apiKey
info:
  description: App-facing (orchestrator-first) API for the DPoP-bound registration and login demo. See docs/05-api.md for
    the full contract; the Keycloak-facing kc facade is out of scope for this build (docs/08-projektrahmen.md).
  title: DPoP-Demo Orchestrator API
  version: v1
openapi: 3.1.0
paths:
  /mock-kobil/activate:
    post:
      description: Binds this device to the user and creates the device identifier. The activation code is spent in the process.
      operationId: activate
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KobilActivateRequest'
        required: true
      responses:
        '200':
          content:
            '*/*':
              schema:
                additionalProperties:
                  type: string
                type: object
          description: OK
      summary: MC SDK ActivateEvent
      tags:
      - Mock KOBIL
  /mock-kobil/login:
    post:
      description: Checks the device, files an assertion, and returns only the one-time password that points at it. The assertion
        itself never reaches the caller.
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KobilLoginRequest'
        required: true
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/KobilOtpResponse'
          description: OK
      summary: MC SDK LoginEvent
      tags:
      - Mock KOBIL
  /mock-kobil/simulate-risk:
    post:
      description: Has no counterpart in the real product. Without it the risk-rejection path would only ever be reachable
        from a test.
      operationId: simulateRisk
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KobilRiskSimulationRequest'
        required: true
      responses:
        '200':
          content:
            '*/*':
              schema:
                additionalProperties:
                  type: object
                type: object
          description: OK
      summary: 'Demo switch: what this device''s sensors report from now on'
      tags:
      - Mock KOBIL
tags:
- description: 'SMS-TAN: Einrichtung als Faktor, Anmeldung und Login ohne DPoP'
  name: 'Tool: SMS'
- description: Gerätebindung über den externen Dienstleister KOBIL
  name: 'Tool: KOBIL'
- description: Simuliertes KOBIL-Backend - kein Endpunkt dieser Anwendung, sondern der Fremddienst
  name: Mock KOBIL
- description: 'Geraetebindung: Einrichtung und Anmeldung ueber den Geraeteschluessel'
  name: 'Tool: Gerät'
- description: 'Passwort: Einrichtung als Wissensfaktor, Anmeldung und Login ohne DPoP'
  name: 'Tool: Passwort'
- description: 'E-Mail: Bestaetigung der Adresse, Anmeldung und Login ohne DPoP'
  name: 'Tool: E-Mail'
- description: 'QR-Pairing: Freigabe eines Web-Kanals aus einer bereits angemeldeten App'
  name: 'Tool: QR-Login'
