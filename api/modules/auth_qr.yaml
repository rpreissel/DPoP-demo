    patch:
      description: No request body - the call itself is the confirmation.
      operationId: patch
      parameters:
      - in: path
        name: toolSessionId
        required: true
        schema:
          format: uuid
          type: string
      - in: query
        name: bindingKeyRef
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
