components:
  schemas:
    ActiveMethodView:
      description: 'One active authentication method instance. `id` addresses it for DELETE .../methods/{id} - method name
        alone isn''t unique when a method allows multiple instances (e.g. several active `device` entries, one per physical
        device). `label` is a user-chosen display name, set only for multi-instance methods; `null` for singleton ones (email/sms/password),
        which the client labels from `method` itself. `enrolledUnderAcr`/`maxAcr`/`effectiveAcr`/`factorTypes` surface the
        ADR-5 three-way cap (docs/12-entscheidungen.md): `effectiveAcr` is `min(enrolledUnderAcr, maxAcr)`, the level this
        method can actually contribute right now, which can be lower than the tool''s own declared `maxAcr` if it was enrolled
        while the session had proven less.'
      properties:
        effectiveAcr:
          description: min(enrolledUnderAcr, maxAcr) - what this method actually contributes today.
          example: loa1
          type: string
        enrolledUnderAcr:
          description: The level the session had already proven at the moment this method was enrolled (ADR-5) - caps effectiveAcr
            below maxAcr if lower.
          example: loa1
          type: string
        factorTypes:
          example:
          - POSSESSION
          items:
            enum:
            - KNOWLEDGE
            - POSSESSION
            - INHERENCE
            type: string
          type: array
        id:
          example: 7f3e2b1a-0c9d-4e8f-8a1b-2c3d4e5f6a7b
          type: string
        label:
          example: Laptop
          type: string
        maxAcr:
          description: This tool's own declared ceiling - never account/session-specific.
          example: loa2
          type: string
        method:
          example: sms
          type: string
      required:
      - id
      - method
      type: object
    AuthData:
      properties:
        accountId:
          example: 42
          format: int64
          type: integer
        acr:
          example: loa2
          type: string
        amr:
          additionalProperties:
            type: string
          description: 'Method -> who proved it: "orchestrator" for a completed orchestrator tool, "kc" for evidence a native
            Keycloak authenticator already established (docs/05-api.md Abschnitt 3). Informational only - the orchestrator
            alone still resolves the combined acr above, regardless of source.'
          example:
            password: kc
            sms: orchestrator
          type: object
      type: object
    AuthKobilPatchRequest:
      properties:
        otp:
          example: 48210937
          type: string
      type: object
    BiometricUnlock:
      allOf:
      - $ref: '#/components/schemas/KobilUnlockCredential'
      - properties:
          unlockSecret:
            type: string
        type: object
      required:
      - unlockSecret
      - userVerification
    ChannelBlock:
      properties:
        activeMethods:
          description: All active authentication methods on the account, regardless of whether this session's currentAmr proved
            them. currentAmr is session evidence (what THIS channel actually proved); activeMethods is the account's full
            standing method list, unfiltered by device - a lost/stolen device's credential must be removable from any authenticated
            session, not only from that device itself.
          items:
            $ref: '#/components/schemas/ActiveMethodView'
          type: array
        channelSessionId:
          format: uuid
          type: string
        channelType:
          description: Which facade this channel was opened through - APP (DPoP) or KEYCLOAK (docs/02-domaenenmodell.md Abschnitt
            1). Fixed for the channel's whole lifetime.
          example: APP
          type: string
        currentAcr:
          example: loa2
          type: string
        currentAmr:
          example:
          - sms
          - password
          items:
            type: string
          type: array
        state:
          example: AUTHENTICATED
          type: string
      required:
      - channelSessionId
      - channelType
      - state
      type: object
    ChannelResponse:
      properties:
        authData:
          $ref: '#/components/schemas/AuthData'
          description: KEYCLOAK channels only (docs/05-api.md Abschnitt 3) - never present for APP.
        channel:
          $ref: '#/components/schemas/ChannelBlock'
        demo:
          $ref: '#/components/schemas/DemoInfo'
          description: Demo-only correlation IDs, never part of the production contract.
        next:
          $ref: '#/components/schemas/Next'
        stepData:
          additionalProperties:
            type: object
          description: 'Whatever the current step needs to render: missing fields, selection options, or a retry reason.'
          example:
            options:
            - ident-fsc
            - ident-eid
          type: object
      required:
      - channel
      type: object
    DemoInfo:
      additionalProperties: true
      properties:
        accountId:
          example: 42
          format: int64
          type: integer
        journeys:
          description: The running journey chain for this channel, outermost first - see [JourneyDebugStep]. Empty once nothing
            is running.
          items:
            $ref: '#/components/schemas/JourneyDebugStep'
          type: array
        personId:
          example: 7
          format: int64
          type: integer
      type: object
    EnrollKobilPatchRequest:
      properties:
        activated:
          example: true
          type: boolean
        biometricConsent:
          example: true
          type: boolean
        label:
          example: Diensthandy
          type: string
      type: object
    JourneyDebugStep:
      properties:
        intent:
          example: DELETE_ACCOUNT
          type: string
        journeyId:
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
          type: string
        lifecycle:
          example: SUSPENDED
          type: string
        note:
          description: 'Demo-only: why this journey''s current step looks the way it does - either why its tool became the
            automatic choice, or why a selection among several is being shown at all. Null whenever the step already explains
            itself (e.g. a Prompt), never part of the production contract.'
          example: Gerät wiedererkannt - automatisch vorgeschlagen.
          type: string
        stateType:
          example: ConfirmPending
          type: string
      required:
      - intent
      - journeyId
      - lifecycle
      - stateType
      type: object
    KobilPinReleaseRequest:
      properties:
        unlock:
          oneOf:
          - $ref: '#/components/schemas/BiometricUnlock'
          - $ref: '#/components/schemas/PasswordUnlock'
      required:
      - unlock
      type: object
    KobilUnlockCredential:
      discriminator:
        mapping:
          biometric: '#/components/schemas/BiometricUnlock'
          password: '#/components/schemas/PasswordUnlock'
        propertyName: kind
      properties:
        kind:
          type: string
        userVerification:
          enum:
          - PIN
          - BIOMETRIC
          type: string
      required:
      - kind
      type: object
    Next:
      properties:
        context:
          example: authentication
          type: string
        step:
          example: auth
          type: string
        toolId:
          example: auth-sms
          type: string
        toolSessionId:
          format: uuid
          type: string
        type:
          example: tool
          type: string
      required:
      - step
      - type
      type: object
    PasswordUnlock:
      allOf:
      - $ref: '#/components/schemas/KobilUnlockCredential'
      - properties:
          password:
            type: string
        type: object
      required:
      - password
      - userVerification
  securitySchemes:
    dpop:
      description: DPoP proof JWT, one per request, bound to method and URL (docs/09-dpop.md). The App channel's proof; the
        binding key is derived from it and is never supplied by the caller.
      in: header
      name: DPoP
      type: apiKey
    kcPeerAuth:
      bearerFormat: JWT
      description: 'Signed peer-auth assertion (docs/05-api.md Abschnitt 3, ADR-7). The Web channel''s proof: Keycloak calls
        server-to-server, and the channel anchor comes out of the assertion.'
      scheme: bearer
      type: http
info:
  description: App-facing (orchestrator-first) API for the DPoP-bound registration and login demo. See docs/05-api.md for
    the full contract; the Keycloak-facing kc facade is out of scope for this build (docs/08-projektrahmen.md).
  title: DPoP-Demo Orchestrator API
  version: v1
openapi: 3.1.0
paths:
  /orchestrator/api/v1/channels/{channelSessionId}/tools/auth-kobil:
    post:
      operationId: activate_1
      parameters:
      - in: path
        name: channelSessionId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '201':
          content:
            application/json:
              example:
                channel:
                  channelSessionId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  state: ANONYMOUS
                next:
                  step: unlock
                  toolId: auth-kobil
                  toolSessionId: 9c858901-8a57-4791-81fe-4c455b099bc9
                  type: tool
                stepData:
                  unlockOptions:
                  - biometric
                  - password
              schema:
                $ref: '#/components/schemas/ChannelResponse'
          description: Created
      security:
      - dpop: [
          ]
      - kcPeerAuth: [
          ]
      summary: Activate auth-kobil
      tags:
      - 'Tool: KOBIL'
  /orchestrator/api/v1/channels/{channelSessionId}/tools/enroll-kobil:
    post:
      description: Provisions the KOBIL user and returns everything the app's SDK needs for its activation call - including
        the PIN, which this backend mints and keeps.
      operationId: activate
      parameters:
      - in: path
        name: channelSessionId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '201':
          content:
            application/json:
              example:
                channel:
                  channelSessionId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  currentAcr: loa2
                  currentAmr:
                  - fsc
                  state: AUTHENTICATED
                next:
                  step: activate
                  toolId: enroll-kobil
                  toolSessionId: 9c858901-8a57-4791-81fe-4c455b099bc9
                  type: tool
                stepData:
                  activationCode: K7M2PQX9
                  kobilUserId: kob-1a2b3c4d5e6f
                  missingFields:
                  - activated
                  - biometricConsent
                  pin: '40318827'
                  tenantId: dpop-demo
                  unlockSecret: xE1r...
              schema:
                $ref: '#/components/schemas/ChannelResponse'
          description: Created
      security:
      - dpop: [
          ]
      - kcPeerAuth: [
          ]
      summary: Activate enroll-kobil
      tags:
      - 'Tool: KOBIL'
  /orchestrator/api/v1/tools/{toolSessionId}/auth-kobil:
    get:
      operationId: read_1
      parameters:
      - in: path
        name: toolSessionId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ChannelResponse'
          description: OK
      security:
      - dpop: [
          ]
      - kcPeerAuth: [
          ]
      summary: Read the current auth-kobil state
      tags:
      - 'Tool: KOBIL'
    patch:
      description: The backend fetches the assertion behind the OTP from KOBIL, compares the device identifier with the enrolled
        one and checks the reported risks.
      operationId: patch_1
      parameters:
      - in: path
        name: toolSessionId
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthKobilPatchRequest'
      responses:
        '200':
          content:
            application/json:
              example:
                channel:
                  channelSessionId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  currentAcr: loa2
                  currentAmr:
                  - kobil
                  - biometric
                  state: AUTHENTICATED
                next:
                  context: authentication
                  step: authenticated
                  type: orchestrator
              schema:
                $ref: '#/components/schemas/ChannelResponse'
          description: OK
      security:
      - dpop: [
          ]
      - kcPeerAuth: [
          ]
      summary: Redeem the one-time password
      tags:
      - 'Tool: KOBIL'
  /orchestrator/api/v1/tools/{toolSessionId}/auth-kobil/pin-releases:
    post:
      description: The app presents either the locally stored unlock secret (guarded by its biometric prompt) or the account
        password. The PIN is in this response and nowhere else - a later GET will not return it again.
      operationId: releasePin
      parameters:
      - in: path
        name: toolSessionId
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KobilPinReleaseRequest'
        required: true
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ChannelResponse'
          description: Not released - an ordinary retryable failure, deliberately not an error status
        '201':
          content:
            application/json:
              example:
                channel:
                  channelSessionId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  state: ANONYMOUS
                next:
                  step: otp
                  toolId: auth-kobil
                  toolSessionId: 9c858901-8a57-4791-81fe-4c455b099bc9
                  type: tool
                stepData:
                  kobilPin: '40318827'
                  kobilUserId: kob-1a2b3c4d5e6f
                  missingFields:
                  - otp
                  tenantId: dpop-demo
              schema:
                $ref: '#/components/schemas/ChannelResponse'
          description: Released
      security:
      - dpop: [
          ]
      - kcPeerAuth: [
          ]
      summary: Release the backend-held PIN
      tags:
      - 'Tool: KOBIL'
  /orchestrator/api/v1/tools/{toolSessionId}/enroll-kobil:
    get:
      operationId: read
      parameters:
      - in: path
        name: toolSessionId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ChannelResponse'
          description: OK
      security:
      - dpop: [
          ]
      - kcPeerAuth: [
          ]
      summary: Read the current enroll-kobil state
      tags:
      - 'Tool: KOBIL'
    patch:
      description: Records the credential once KOBIL reports a bound device for this user.
      operationId: patch
      parameters:
      - in: path
        name: toolSessionId
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollKobilPatchRequest'
      responses:
        '200':
          content:
            application/json:
              example:
                channel:
                  channelSessionId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  currentAcr: loa2
                  currentAmr:
                  - fsc
                  - kobil
                  - biometric
                  state: AUTHENTICATED
                next:
                  context: authentication
                  step: authenticated
                  type: orchestrator
              schema:
                $ref: '#/components/schemas/ChannelResponse'
          description: OK
      security:
      - dpop: [
          ]
      - kcPeerAuth: [
          ]
      summary: Confirm the KOBIL activation
      tags:
      - 'Tool: KOBIL'
tags:
- description: 'SMS-TAN: Einrichtung als Faktor, Anmeldung und Login ohne DPoP'
  name: 'Tool: SMS'
- description: 'E-Mail: Bestaetigung der Adresse, Anmeldung und Login ohne DPoP'
  name: 'Tool: E-Mail'
- description: 'Passwort: Einrichtung als Wissensfaktor, Anmeldung und Login ohne DPoP'
  name: 'Tool: Passwort'
- description: 'Geraetebindung: Einrichtung und Anmeldung ueber den Geraeteschluessel'
  name: 'Tool: Gerät'
- description: 'QR-Pairing: Freigabe eines Web-Kanals aus einer bereits angemeldeten App'
  name: 'Tool: QR-Login'
- description: Gerätebindung über den externen Dienstleister KOBIL
  name: 'Tool: KOBIL'
