      tags:
      - Channels
  /orchestrator/api/v1/channels/{channelSessionId}/idclaims:
    get:
      description: 'Business-facing claims (accountId/personId/versnr/name/email/acr/amr/auth_time) - a separate resource
        from the AccessToken''s own claims, not encoded into it. name is the one place the client learns who is logged in
