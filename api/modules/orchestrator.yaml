  /orchestrator/api/v1/channels/{channelSessionId}/token:
    get:
      description: 'Covers both first issuance and refresh - call this again whenever a fresh token might be needed. minValiditySeconds
        (default 15) is the caller''s tolerance: if the current AccessToken still has at least that much life left, it comes
        back unchanged; otherwise the backend mints a new one (silently using the remembered RefreshToken where possible).
        The RefreshToken value itself is never returned - it''s a credential and stays server-side.'
      operationId: getToken
      parameters:
      - in: path
        name: channelSessionId
        required: true
        schema:
          format: uuid
          type: string
      - in: query
        name: minValiditySeconds
        required: false
        schema:
          default: 15
          format: int64
          type: integer
      responses:
        '200':
          content:
            application/json:
              example:
                accessExpiresAt: '2026-08-28T18:05:00Z'
                accessToken: eyJhbGciOiJub25lIn0.eyJzdWIiOiI0MiIsImFjciI6ImxvYTIiLCJhbXIiOlsic21zIl19.
                refreshExpiresAt: '2026-08-29T18:00:00Z'
                tokenType: Bearer
              schema:
                $ref: '#/components/schemas/TokenResponse'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: ../openapi.yaml#/components/schemas/ErrorResponse
          description: Error. `error` names the case; its HTTP status is fixed per code (see ErrorResponse).
      security:
      - dpop: [
          ]
      - kc-peer-auth: [
          ]
      summary: Get the mock Keycloak AccessToken
      tags:
      - Channels
