            '*/*':
              schema:
                $ref: '#/components/schemas/MgmtPasswordVerifyResponse'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: ../openapi.yaml#/components/schemas/ErrorResponse
          description: Error. `error` names the case; its HTTP status is fixed per code (see ErrorResponse).
      security:
      - kc-peer-auth: [
          ]
      summary: Verify a candidate password against the account's stored credential
      tags:
      - KC password management
  /orchestrator/api/v1/tools/catalog:
    get:
      description: No auth, no channel required - purely descriptive.
      operationId: catalog
      responses:
        '200':
          content:
            application/json:
              example:
              - method: fsc
                role: IDENTIFICATION
                toolId: ident-fsc
              - method: sms
                role: ENROLLMENT
                toolId: enroll-sms
              - method: sms
                role: IDENTIFIED_AUTH
                toolId: auth-sms
              - method: sms
                role: LOOKUP_AUTH
                toolId: auth-sms-lookup
              schema:
                items:
                  $ref: '#/components/schemas/ToolCatalogEntry'
                type: array
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: ../openapi.yaml#/components/schemas/ErrorResponse
          description: Error. `error` names the case; its HTTP status is fixed per code (see ErrorResponse).
      summary: List every registered tool
      tags:
      - Tool catalog
  /orchestrator/api/v1/tools/enroll-password/mgmt/{accountId}:
    post:
      operationId: set
      parameters:
      - in: path
        name: accountId
        required: true
        schema:
          format: int64
          type: integer
      - in: header
        name: Authorization
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MgmtPasswordSetRequest'
        required: true
      responses:
        '200':
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: ../openapi.yaml#/components/schemas/ErrorResponse
          description: Error. `error` names the case; its HTTP status is fixed per code (see ErrorResponse).
      security:
      - kc-peer-auth: [
          ]
      summary: Replace the account's password credential with a new one
      tags:
      - KC password management
  /orchestrator/api/v1/tools/{toolSessionId}/{toolId}:
    delete:
      description: Moves the journey on according to the state it is standing on - to the next fallback option, back to the
        selection step, or to the end of the journey if nothing else could be offered.
      operationId: switchAway
      parameters:
      - in: path
        name: toolSessionId
        required: true
        schema:
          format: uuid
          type: string
      - in: path
        name: toolId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              example:
                channel:
                  channelSessionId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  currentAcr: loa1
                  state: STEP_UP_IN_PROGRESS
                next:
                  context: auth
                  step: selectMethod
                  type: orchestrator
                stepData:
                  kind: select-method
                  options:
                  - auth-password
                  - auth-device
              schema:
                $ref: ../openapi.yaml#/components/schemas/ChannelResponse
          description: auth-sms abandoned during a fallback chain - offers the other loa2 candidates.
        default:
          content:
            application/json:
              schema:
                $ref: ../openapi.yaml#/components/schemas/ErrorResponse
          description: Error. `error` names the case; its HTTP status is fixed per code (see ErrorResponse).
      security:
      - dpop: [
          ]
      - kc-peer-auth: [
          ]
      summary: Abandon this tool attempt
      tags:
      - Tools
  /orchestrator/api/v1/tools/{toolSessionId}/{toolId}/back:
    post:
      description: 'Ends this tool attempt without declining it: the journey shows its selection page again, with every method
        still on offer - this one included, and even when it is the only one. Where the journey has no selection page (a single
        preferred method), this is the same as abandoning.'
      operationId: back
      parameters:
      - in: path
        name: toolSessionId
        required: true
        schema:
          format: uuid
          type: string
      - in: path
        name: toolId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              example:
                channel:
                  channelSessionId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  state: REGISTERING
                next:
                  context: registration
                  step: selectIdentificationMethod
                  type: orchestrator
                stepData:
                  kind: select-method
                  options:
                  - ident-fsc
                  - ident-eid
                  - ident-nect
              schema:
                $ref: ../openapi.yaml#/components/schemas/ChannelResponse
          description: Back from ident-fsc during registration - both identification methods are offered again.
        default:
          content:
            application/json:
              schema:
                $ref: ../openapi.yaml#/components/schemas/ErrorResponse
          description: Error. `error` names the case; its HTTP status is fixed per code (see ErrorResponse).
      security:
      - dpop: [
          ]
      - kc-peer-auth: [
          ]
      summary: Go back from this tool to the selection
      tags:
      - Tools
  /orchestrator/demo/server-info:
    get:
      operationId: get_1
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ServerInfo'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: ../openapi.yaml#/components/schemas/ErrorResponse
          description: Error. `error` names the case; its HTTP status is fixed per code (see ErrorResponse).
      summary: Current server status
      tags:
      - 'Demo: server info'
