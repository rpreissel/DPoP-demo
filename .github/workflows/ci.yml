name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # gradle-wrapper.jar liegt als Binaerdatei im Repo (ohne sie scheitert jeder frische
      # Checkout). Diese Pruefung vergleicht sie gegen die Pruefsummen echter Gradle-Releases -
      # eine untergeschobene Wrapper-Jar wuerde sonst unbemerkt im Build ausgefuehrt.
      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: gradle/actions/setup-gradle@v4

      # Deckt Backend und Frontend ab: der Gradle-Build zieht ueber processResources ->
      # npmBuild auch den Vite-Build mit hoch, ein Fehler dort bricht hier ab.
      - name: Backend-Tests
        run: ./gradlew test

      - name: Frontend-Tests
        working-directory: frontend
        run: npm test
