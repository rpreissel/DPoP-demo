# Echtes Keycloak fuer den Web-/Keycloak-Kanal (docs/05-api.md Abschnitt 3), als Ersatz fuer
# das reine Mock-Keycloak-Frontend (bd DPoP-demo-f9o.9) im echten Betrieb. `compose up` startet
# beides: Keycloak UND den containerisierten Orchestrator - der wendet beim eigenen Start ueber
# KeycloakMigrationRunnerStartup automatisch alle keycloak-migrations/migrations/*.kc.kts an
# (Ersatz fuer den frueheren separaten Tofu-Schritt, siehe git-history fuer infra/tofu).
#
# Beide Dockerfiles bauen nichts mehr selbst - `./gradlew stagePodmanArtifacts` muss vorher einmal
# auf dem Host laufen (baut Jar/Frontend/Extension-Jar und legt sie unter build/podman ab), dann
# kopieren `podman-compose build`/`up --build` nur noch fertige Artefakte in die Images.
services:
  keycloak:
    build:
      # build/podman/keycloak statt Repo-Wurzel: stagePodmanArtifacts kopiert dorthin bereits nur
      # die fertigen Artefakte (Jar, Theme, Healthcheck, Dockerfile mit kontext-relativen
      # COPY-Pfaden - siehe stageKeycloakArtifact in build.gradle.kts), Podman muss also nicht mehr
      # das ganze Repo (inkl. .git, node_modules, Gradle-Caches) durchlaufen und hochladen.
      context: ./build/podman/keycloak
      dockerfile: Dockerfile
      args:
        # Woanders (z.B. am Arbeitsplatz mit Redhat-Keycloak statt Community-Keycloak) per Env-Var
        # ueberschreibbar - siehe keycloak-extension/Dockerfile fuer die Begruendung, warum
        # KEYCLOAK_BASE_IMAGE beim oeffentlichen Image bleibt. Das Dockerfile baut nichts mehr mit
        # Gradle selbst (siehe `./gradlew stagePodmanArtifacts`), deshalb gibt es hier keine
        # Builder-/Gradle-Distribution-Args mehr.
        KEYCLOAK_BASE_IMAGE: ${KEYCLOAK_BASE_IMAGE:-quay.io/keycloak/keycloak:26.5.5}
    environment:
      # HTTP komplett aus - nur noch HTTPS, auch fuer Server-zu-Server-Aufrufe (Orchestrator ->
      # Keycloak Admin-API/JWKS). Cookie-basierte SSO-Wiedererkennung (auth-cookie,
      # Grundlage fuer den Step-up-Pfad (Keycloak-eigene LoA-Subflow-Struktur) braucht ohnehin einen
      # "secure context" - der Browser verweigert sonst das Cookie bei Cross-Origin-Requests.
      KC_HTTP_ENABLED: 'false'
      KC_HOSTNAME: https://localhost:8543
      KC_HOSTNAME_STRICT: 'false'
      KC_HEALTH_ENABLED: 'true'
      # Lives in the persistent keycloak-data volume, not /opt/keycloak/conf (image filesystem) -
      # generated once by `command` below on first start, so it survives image rebuilds instead of
      # getting a fresh keypair (and a new Chrome cert-trust prompt) every time.
      KC_HTTPS_KEY_STORE_FILE: /opt/keycloak/data/server.keystore.p12
      KC_HTTPS_KEY_STORE_PASSWORD: password
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # Wohin die Extension den Orchestrator anspricht (OrchestratorConfig.java) - der Default passt
      # zu ./gradlew bootRun auf dem Host, siehe Kommentar oben.
      ORCHESTRATOR_BASE_URL: ${ORCHESTRATOR_BASE_URL:-http://host.containers.internal:8080}
      ORCHESTRATOR_PEER_AUTH_ISSUER: ${ORCHESTRATOR_PEER_AUTH_ISSUER:-dpop-demo-keycloak}
      ORCHESTRATOR_PEER_AUTH_AUDIENCE: ${ORCHESTRATOR_PEER_AUTH_AUDIENCE:-dpop-demo-orchestrator}
    # Kein extra_hosts fuer host.containers.internal: Podman Machine (gvproxy, macOS) loest den
    # Namen bereits selbst auf; ein expliziter "host-gateway"-Eintrag scheitert auf dieser
    # Bridge-Netzwerkkonfiguration mit "host containers internal IP address is empty" (Podman kann
    # dort keinen host-gateway-Wert ermitteln). Auf reinem Linux-Podman ohne Machine-VM muesste
    # ORCHESTRATOR_BASE_URL stattdessen auf die tatsaechliche Host-IP zeigen.
    ports:
      - "8543:8443"
    volumes:
      - keycloak-data:/opt/keycloak/data
    # Generates the self-signed keystore into the persistent volume on first start only (see
    # KC_HTTPS_KEY_STORE_FILE above) - a later rebuild finds it already there and reuses it as-is,
    # keeping the cert (and Chrome's trust decision for it) stable across image rebuilds.
    # entrypoint override needed: the base image's own ENTRYPOINT is kc.sh itself, so `command`
    # alone would just be appended as kc.sh's own arguments (`kc.sh sh -c ...`), not run as a shell.
    entrypoint: ["sh", "-c"]
    command:
      - |
        if [ ! -f /opt/keycloak/data/server.keystore.p12 ]; then
          keytool -genkeypair -alias server -keyalg RSA -keysize 2048 -validity 3650 \
            -keystore /opt/keycloak/data/server.keystore.p12 -storetype PKCS12 -storepass password \
            -dname "CN=localhost" -ext "SAN=dns:localhost,ip:127.0.0.1"
        fi
        exec /opt/keycloak/bin/kc.sh start-dev --https-port=8443
    healthcheck:
      # Kein curl/wget/openssl in diesem Image, aber ein voller JDK (jdk.compiler-Modul vorhanden)
      # - JwksHealthCheck.java (Single-File-Source-Launch, JEP 330) fragt statt eines reinen
      # TCP-Connects gezielt das JWKS des Master-Realms ab. Das ist ein echter
      # Anwendungsebenen-Check: ein reiner Port-Connect beweist nur, dass irgendein Listener
      # gebunden hat, nicht dass Keycloaks REST-Schicht (Realm-Subsystem, Datenbankverbindung etc.)
      # tatsaechlich Anfragen beantwortet - genau die Luecke, die vorher ueber
      # restart: on-failure unten kaschiert wurde, weil der TCP-Port in seltenen Faellen offen sein
      # kann, bevor die REST-Schicht wirklich bereit ist.
      #
      # interval kurz gehalten, damit depends_on/service_healthy unten den Orchestrator nicht
      # unnoetig lange blockiert; restart: on-failure bleibt trotzdem als Sicherheitsnetz, falls
      # `podman wait --condition=healthy` sich doch einmal mit Podmans eigener
      # Healthcheck-Initialisierung ueberschneidet.
      test: ["CMD-SHELL", "java /opt/keycloak/healthcheck/JwksHealthCheck.java >/dev/null 2>&1"]
      interval: 2s
      timeout: 3s
      start_period: 5s
      retries: 150

  # Containerisierter Orchestrator - wendet beim eigenen Start automatisch alle
  # keycloak-migrations/migrations/*.kc.kts an (KeycloakMigrationRunnerStartup, nur im
  # `keycloak`-Spring-Profil aktiv). restart: on-failure bleibt als Sicherheitsnetz stehen (siehe
  # Healthcheck-Kommentar oben) - seit der JWKS-basierte Healthcheck echte REST-Bereitschaft statt
  # nur eines offenen TCP-Ports prueft, greift es im Normalfall nicht mehr (verifiziert:
  # RestartCount=0 ueber mehrere frische `podman-compose up`-Laeufe).
  orchestrator:
    build:
      # build/podman/orchestrator statt Repo-Wurzel - siehe Begruendung beim keycloak-Service oben
      # (stageOrchestratorDockerfile in build.gradle.kts).
      context: ./build/podman/orchestrator
      dockerfile: Dockerfile
      args:
        # Wie bei keycloak: von aussen ueberschreibbar, Default zieht Red-Hat-UBI-Images. Das
        # Dockerfile ist reines Laufzeit-Image (siehe `./gradlew stagePodmanArtifacts`), deshalb
        # gibt es hier keine Frontend-/Build-/Gradle-Distribution-Args mehr.
        RUNTIME_BASE_IMAGE: ${ORCHESTRATOR_RUNTIME_BASE_IMAGE:-registry.access.redhat.com/ubi9/openjdk-21-runtime:latest}
    depends_on:
      # service_healthy statt nur service_started: erst wenn Keycloaks JWKS-Healthcheck oben
      # erfolgreich war, macht ein erster Migrations-Versuch ueberhaupt Sinn.
      keycloak:
        condition: service_healthy
    restart: on-failure
    environment:
      SPRING_PROFILES_ACTIVE: keycloak
      # /data liegt auf dem eigenen Volume (siehe unten).
      SPRING_DATASOURCE_URL: jdbc:h2:file:/data/dpopdb
      # Im Compose-Netzwerk heisst Keycloak "keycloak", nicht "localhost" wie in
      # application-keycloak.yml (das ist fuer den Host-Lauf per gradlew gedacht). Das
      # selbstsignierte Zertifikat wird trotzdem akzeptiert, siehe KeycloakTlsConfig.kt
      # (Trust-all + Hostname-Verifier-all, nur im "keycloak"-Profil aktiv).
      KEYCLOAK_MIGRATE_BASE_URL: https://keycloak:8443
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-dpop-demo}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      ORCHESTRATOR_ADMIN_CLIENT_SECRET: ${ORCHESTRATOR_ADMIN_CLIENT_SECRET:-change-me-orchestrator-admin}
      ORCHESTRATOR_APP_CLIENT_SECRET: ${ORCHESTRATOR_APP_CLIENT_SECRET:-change-me-orchestrator-app-token}
      KC_PEERAUTH_JWKSURI: https://keycloak:8443/realms/${KEYCLOAK_REALM:-dpop-demo}/orchestrator-jwks/.well-known/jwks.json
      # The browser receives its access token from Keycloak's public host port. Keep this
      # external issuer separate from the internal service URLs used for JWKS and admin calls.
      KC_OIDC_ISSUER: https://localhost:8543/realms/${KEYCLOAK_REALM:-dpop-demo}
      KC_OIDC_CERTSURI: https://keycloak:8443/realms/${KEYCLOAK_REALM:-dpop-demo}/protocol/openid-connect/certs
      KEYCLOAKSYNC_BASEURL: https://keycloak:8443
      KEYCLOAKSYNC_REALM: ${KEYCLOAK_REALM:-dpop-demo}
      KEYCLOAKSYNC_ADMINCLIENTID: orchestrator-admin
      KEYCLOAKSYNC_ADMINCLIENTSECRET: ${ORCHESTRATOR_ADMIN_CLIENT_SECRET:-change-me-orchestrator-admin}
      KEYCLOAKSYNC_APPCLIENTID: orchestrator-app-token
      KEYCLOAKSYNC_APPCLIENTSECRET: ${ORCHESTRATOR_APP_CLIENT_SECRET:-change-me-orchestrator-app-token}
    ports:
      - "8080:8080"
    volumes:
      - orchestrator-data:/data
    healthcheck:
      # Ohne diesen Healthcheck zeigt `podman ps` den Container dauerhaft als "(starting)" an,
      # obwohl die App laengst durchgestartet ist (Health.Status bleibt ohne HEALTHCHECK
      # unbestimmt) - reiner TCP-Connect reicht hier, anders als bei Keycloak (siehe dortiger
      # Kommentar): Tomcat bindet Port 8080 erst, wenn Spring Boot fertig hochgefahren ist, ein
      # HTTP-GET auf "/" bestaetigt zusaetzlich, dass der Servlet-Container tatsaechlich antwortet.
      # Kein curl/wget in diesem Image, aber bash - derselbe rohe HTTP-Request-Trick wie beim
      # Keycloak-Check, nur ohne TLS (Port 8080 ist reines HTTP).
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET / HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && head -n 1 <&3 | grep -q 200' 2>/dev/null"]
      interval: 3s
      timeout: 3s
      start_period: 10s
      retries: 60

volumes:
  keycloak-data:
  orchestrator-data:
