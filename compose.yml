# Echtes Keycloak fuer den Web-/Keycloak-Kanal (docs/ideen/web-keycloak-kanal.md), als Ersatz fuer
# das reine Mock-Keycloak-Frontend (bd DPoP-demo-f9o.9) im echten Betrieb. Der Orchestrator selbst
# laeuft bewusst NICHT in diesem Compose - er bleibt die lokale H2-Datei-Instanz (./gradlew bootRun
# auf Port 8080), Keycloak ruft ihn ueber host.containers.internal an (siehe extra_hosts unten).
services:
  keycloak:
    build:
      context: .
      dockerfile: keycloak-extension/Dockerfile
    environment:
      # HTTP komplett aus - nur noch HTTPS, auch fuer Server-zu-Server-Aufrufe (Orchestrator ->
      # Keycloak Admin-API/JWKS, Tofu-Provider). Cookie-basierte SSO-Wiedererkennung (auth-cookie,
      # Grundlage fuer den Step-up-Pfad docs/ideen/web-keycloak-kanal.md #9) braucht ohnehin einen
      # "secure context" - der Browser verweigert sonst das Cookie bei Cross-Origin-Requests.
      KC_HTTP_ENABLED: 'false'
      KC_HOSTNAME: https://localhost:8543
      KC_HOSTNAME_STRICT: 'false'
      KC_HEALTH_ENABLED: 'true'
      KC_HTTPS_KEY_STORE_FILE: /opt/keycloak/conf/server.keystore.p12
      KC_HTTPS_KEY_STORE_PASSWORD: password
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # Wohin die Extension den Orchestrator anspricht (OrchestratorConfig.java) - der Default passt
      # zu ./gradlew bootRun auf dem Host, siehe Kommentar oben.
      ORCHESTRATOR_BASE_URL: ${ORCHESTRATOR_BASE_URL:-http://host.containers.internal:8080}
      ORCHESTRATOR_PEER_AUTH_ISSUER: ${ORCHESTRATOR_PEER_AUTH_ISSUER:-dpop-demo-keycloak}
      ORCHESTRATOR_PEER_AUTH_AUDIENCE: ${ORCHESTRATOR_PEER_AUTH_AUDIENCE:-dpop-demo-orchestrator}
    # Kein extra_hosts fuer host.containers.internal: Podman Machine (gvproxy, macOS) loest den
    # Namen bereits selbst auf; ein expliziter "host-gateway"-Eintrag scheitert auf dieser
    # Bridge-Netzwerkkonfiguration mit "host containers internal IP address is empty" (Podman kann
    # dort keinen host-gateway-Wert ermitteln). Auf reinem Linux-Podman ohne Machine-VM muesste
    # ORCHESTRATOR_BASE_URL stattdessen auf die tatsaechliche Host-IP zeigen.
    ports:
      - "8543:8443"
    volumes:
      - keycloak-data:/opt/keycloak/data
    command: ["start-dev", "--https-port=8443"]
    healthcheck:
      # Nur ein Lebenszeichen fuer Podman selbst - das eigentliche Warten auf "wirklich bereit"
      # macht run-keycloak-config.sh gegen /health/ready, genau wie in auth-sandbox-2.
      test: ["CMD-SHELL", "exit 0"]
      interval: 10s
      timeout: 5s
      retries: 30

  keycloak-config:
    image: ghcr.io/opentofu/opentofu:1.8.8
    environment:
      KEYCLOAK_URL: https://keycloak:8443
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-dpop-demo}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KEYCLOAK_BROWSER_CLIENT_ID: ${KEYCLOAK_BROWSER_CLIENT_ID:-dpop-demo-web}
      KEYCLOAK_BROWSER_CLIENT_SECRET: ${KEYCLOAK_BROWSER_CLIENT_SECRET:-change-me-browser}
      ORCHESTRATOR_ADMIN_CLIENT_SECRET: ${ORCHESTRATOR_ADMIN_CLIENT_SECRET:-change-me-orchestrator-admin}
      TOFU_STATE_DIR: ${TOFU_STATE_DIR:-/state}
    depends_on:
      keycloak:
        condition: service_started
    volumes:
      - ./infra/tofu/keycloak:/workspace
      - tofu-state:${TOFU_STATE_DIR:-/state}
    working_dir: /workspace
    entrypoint: ["/bin/sh", "/workspace/run-keycloak-config.sh"]
    restart: on-failure

volumes:
  keycloak-data:
  tofu-state:
