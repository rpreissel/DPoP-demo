org.gradle.configuration-cache=false

# Ohne diese Werte laeuft der Gradle-Daemon mit 512 MB. Das reicht fuer compileKotlin dieses
# Projekts nicht, sobald der Compiler im Gradle-Prozess selbst laeuft - so kompiliert CodeQL
# (Tracer im Compiler), und lokal passiert es, wenn der Kotlin-Daemon ausfaellt. Beides endete mit
# "OutOfMemoryError: GC overhead limit exceeded". Der Kotlin-Daemon bekommt dieselbe Grenze.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx3g

# Kotlin im Kotlin-Daemon kompilieren, inkrementell.
# - Nicht "in-process": Dann haelt jeder Gradle-Daemon die Cache-Dateien im eigenen Prozess offen.
#   Laufen zwei Gradle-Daemons (z. B. einer vom E2E-Lauf mit bootRun), scheitert das Schliessen
#   ("Could not close incremental caches ... lookups.tab"), die Klassen sind schon geschrieben, der
#   Cache bleibt beschaedigt - daher sporadische "Unresolved reference" auf unveraenderte Klassen.
# - Der Kotlin-Daemon ist ein gemeinsamer Prozess fuer alle Gradle-Daemons und verwaltet die Caches
#   allein. Seine Abstuerze ("Daemon compilation failed") gab es mit Kotlin 2.2.21 neben Gradles 2.4.
# - "out-of-process" gibt es seit Kotlin 2.4.0 nicht mehr.
kotlin.compiler.execution.strategy=daemon
