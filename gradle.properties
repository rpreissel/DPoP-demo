org.gradle.configuration-cache=false

# Ohne diese Werte laeuft der Gradle-Daemon mit 512 MB. Das reicht fuer compileKotlin dieses
# Projekts nicht, sobald der Compiler im Gradle-Prozess selbst laeuft - so kompiliert CodeQL
# (Tracer im Compiler), und lokal passiert es, wenn der Kotlin-Daemon ausfaellt. Beides endete mit
# "OutOfMemoryError: GC overhead limit exceeded". Der Kotlin-Daemon bekommt dieselbe Grenze.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx3g

# Kotlin im Gradle-Prozess kompilieren statt im langlebigen Kotlin-Daemon: Der Daemon und sein
# inkrementeller Cache gerieten wiederholt aus dem Tritt ("Storage ... is already registered",
# "Daemon compilation failed: null"), vor allem nach ./gradlew --stop oder bei zwei Builds
# gleichzeitig. Voraussetzung ist, dass die Kotlin-Version des Projekts zu der von Gradle passt
# (Gradle 9.7 bringt 2.4.0 mit) - mit 2.2.21 scheiterte "in-process" am allopen-Plugin. Den
# Speicher dafuer hat der Gradle-Daemon oben schon.
kotlin.compiler.execution.strategy=in-process
