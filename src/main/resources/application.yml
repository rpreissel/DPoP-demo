spring:
  application:
    name: dpop-demo
  datasource:
    url: jdbc:h2:file:./data/dpopdb
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  h2:
    console:
      # Bewusst an und bewusst auch aus dem Netz erreichbar - erklaerte Projektentscheidung.
      #
      # Damit die Abwaegung dokumentiert bleibt: es gibt kein Spring Security im Classpath, also
      # bewacht NICHTS diesen Pfad. Mit web-allow-others=true faellt auch die Localhost-Schranke,
      # d.h. jeder, der den Port erreicht, hat vollen Lese-/Schreibzugriff auf die Datei-DB -
      # inklusive Passwort-Hashes (auth_password), Geraeteschluesseln (device_enrollment),
      # Freischaltcodes (fsc_code) und allen Sessions. Das ist fuer eine Demo-/Lehr-Instanz
      # gewollt; eine so konfigurierte Instanz gehoert in kein erreichbares Netz und darf keine
      # echten Daten fuehren.
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

server:
  port: 8080

springdoc:
  swagger-ui:
    # "Try it out" can't work here: DPoP needs a fresh proof signed per request, bound to that
    # exact method+URL and single-use (jti) - a value pasted into Authorize would just misfire as
    # a 401 on every call after the first. Swagger UI stays read-only API reference; use the real
    # frontend to exercise the API.
    supported-submit-methods: []

dpop:
  proof:
    max-clock-skew-seconds: 30
    max-age-seconds: 120
  secrets:
    # Pepper for the short-lived SMS/e-mail OTP hashes. A six-digit code has only 10^6 possible
    # preimages, so a bare digest of it is reversible on sight by anyone who can read the table;
    # this key is what such a reader does not have.
    # Blank (the default) means a fresh random pepper per boot - nothing to check in and forget.
    # A restart then invalidates codes still in flight (they live five minutes) and two instances
    # cannot verify each other's, so set this explicitly for any multi-instance deployment.
    otp-pepper: ""
