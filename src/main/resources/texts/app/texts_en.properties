# Quelle: Bei der Registrierung weist man sich aus - per Freischaltcode aus einem Brief, per eID oder über Nect -, bestätigt die E-Mail-Adresse und richtet ein Anmeldeverfahren ein, etwa SMS, Passwort, Geräteschlüssel oder KOBIL. Damit meldet man sich künftig an, auf der Website auch, indem man die Anmeldung mit der App per QR-Code bestätigt. Für empfindlichere Aktionen verlangt die Demo einen zusätzlichen Nachweis (Step-up).
bei-der-registrierung-weist-man-sich-aus-9240c2=When you register, you prove your identity, with an activation code from a letter, with eID or via Nect. Then you confirm your email address and set up a sign-in method, for example SMS, password, device key or KOBIL. You use it to sign in from then on; on the website also by confirming the sign-in with the app via QR code. For more sensitive actions, the demo asks for additional proof (step-up).
# Quelle: Beide Male meldet Keycloak Sie an. Der Unterschied liegt nur in der ersten Anmeldeseite. Das gilt für „Anmelden“ und „Sicher anmelden“.
beide-male-meldet-keycloak-sie-an-der-b6df89=Either way, Keycloak signs you in. The only difference is the first sign-in page. This applies to “Sign in” and “Sign in securely”.
# Quelle: Beim ersten Mal {registrieren} Sie sich: ausweisen (Freischaltcode aus dem Brief, eID oder Nect), E-Mail-Adresse bestätigen und ein Anmeldeverfahren einrichten. Danach {anmelden} - auf diesem Gerät auch automatisch. Echt ist dabei der Orchestrator mit allen Regeln; simuliert sind Handy, SMS und E-Mail (der Code steht im Formular), Brief, Ausweiskarte, Nect, KOBIL und das Personenverzeichnis.
beim-ersten-mal-registrieren-sie-sich-678bc3=The first time, you {registrieren}: prove your identity (activation code from the letter, eID or Nect), confirm your email address and set up a sign-in method. After that, you {anmelden}, automatically on this device. The orchestrator with all its rules is real; simulated are the phone, SMS and email (the code appears in the form), the letter, the ID card, Nect, KOBIL and the person directory.
