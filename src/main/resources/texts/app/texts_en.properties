# Quelle: Wenn Sie fortfahren, wird dieses Gerät künftig nur noch diesem Konto zugeordnet. Das bisher verbundene Konto muss sich beim nächsten Mal auf diesem Gerät erneut identifizieren.
wenn-sie-fortfahren-wird-dieses-geraet-04ae8e=If you continue, this device will be linked only to this account from now on. The account previously linked to it will have to verify its identity again the next time it is used on this device.
# Quelle: Wenn Sie fortfahren, wird dieses Gerät künftig nur noch Ihrem neuen Konto zugeordnet. Das bisher verbundene Konto muss sich beim nächsten Mal auf diesem Gerät erneut identifizieren. Ohne Zuordnung bleibt Ihr neues Konto nutzbar - Sie melden sich dann künftig über E-Mail und Passwort an.
wenn-sie-fortfahren-wird-dieses-geraet-31d382=If you continue, this device will be linked only to your new account from now on. The account previously linked to it will have to verify its identity again the next time it is used on this device. If you do not link the device, your new account still works, and you will sign in with email and password.
# Quelle: Wenn Sie zustimmen, erkennt der Dienst dieses Gerät beim nächsten Mal wieder und Sie müssen Ihre E-Mail-Adresse nicht erneut eingeben. Sie können auch ohne Verknüpfung fortfahren – dann melden Sie sich künftig wieder über E-Mail und Passwort an.
wenn-sie-zustimmen-erkennt-der-dienst-5a3240=If you agree, we will recognize this device next time and you will not need to enter your email address again. You can also continue without linking the device. You will then sign in with email and password as before.
