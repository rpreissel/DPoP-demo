# Quelle: Wen die Demo hinter einem Konto kennt, sagt seine {rolle}: {versicherter} ist, wer bei uns versichert ist - mit Versicherungsnummer und meist auch KVNR. {partner} ist, wen das Personenverzeichnis nur mit seiner Partnernummer kennt. {interessent} ist ein Konto, dem noch keine Person zugeordnet ist.
