# PROTOTYP: dasselbe wie compose.yml, aber als Kubernetes-YAML fuer `podman kube play`.
# Starten ueber kube/up.sh (baut vorher die Images - kube play kennt keine build.args),
# stoppen mit `podman kube down kube/dpop-demo.yaml` (Volumes bleiben, `--force` loescht sie).
#
# Abweichungen gegenueber compose.yml, jeweils unten am Ort begruendet:
# - Host-Ports 8090/8553 statt 8080/8543 (laeuft neben Compose) -> eigene Setup-Variante "kube".
# - Keine ${VAR:-default}-Interpolation: Admin-Zugang steht im Secret unten.
# - Kein depends_on/service_healthy: ein Init-Container im Orchestrator-Pod wartet auf Keycloaks JWKS.
#
# BEKANNTE LUECKE: frontend/src/webOidc.ts hat https://localhost:8543 fest verdrahtet - der
# Browser-Login des Web-Kanals auf :8090 landet deshalb beim Compose-Keycloak, nicht bei diesem.
# Orchestrator, Realm-Aufbau und Account-Sync laufen dagegen vollstaendig ueber 8090/8553.
apiVersion: v1
kind: Secret
metadata:
  name: dpop-kube-keycloak-admin
type: Opaque
data:
  # admin / admin (base64) - im Compose-Setup per KEYCLOAK_ADMIN[_PASSWORD] ueberschreibbar,
  # hier nur durch Aendern dieser Werte.
  username: YWRtaW4=
  password: YWRtaW4=
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dpop-kube-keycloak-data
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 1Gi}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dpop-kube-orchestrator-data
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 1Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
spec:
  replicas: 1
  selector: {matchLabels: {app: keycloak}}
  template:
    metadata:
      labels: {app: keycloak}
    spec:
      containers:
        # Der Container-Name ist zugleich der DNS-Alias im Podman-Kube-Netz ("keycloak") - der
        # Deployment-Name selbst loest nicht auf, nur "<name>-pod" und die Container-Namen.
        - name: keycloak
          image: localhost/dpop-demo-kube-keycloak:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8443
              hostPort: 8553
          env:
            - {name: KC_HTTP_ENABLED, value: 'false'}
            - {name: KC_HOSTNAME, value: 'https://localhost:8553'}
            - {name: KC_HOSTNAME_STRICT, value: 'false'}
            - {name: KC_HEALTH_ENABLED, value: 'true'}
            - {name: KC_HTTPS_KEY_STORE_FILE, value: /opt/keycloak/data/server.keystore.p12}
            - {name: KC_HTTPS_KEY_STORE_PASSWORD, value: password}
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom: {secretKeyRef: {name: dpop-kube-keycloak-admin, key: username}}
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: dpop-kube-keycloak-admin, key: password}}
          # command ersetzt das ENTRYPOINT (kc.sh), args das CMD - entspricht entrypoint/command
          # in compose.yml. SAN zusaetzlich dns:keycloak, weil der Init-Container des
          # Orchestrators mit Hostname-Verifikation unter diesem Namen prueft.
          command: ["sh", "-c"]
          args:
            - |
              if [ ! -f /opt/keycloak/data/server.keystore.p12 ]; then
                keytool -genkeypair -alias server -keyalg RSA -keysize 2048 -validity 3650 \
                  -keystore /opt/keycloak/data/server.keystore.p12 -storetype PKCS12 -storepass password \
                  -dname "CN=localhost" -ext "SAN=dns:localhost,dns:keycloak,ip:127.0.0.1"
              fi
              exec /opt/keycloak/bin/kc.sh start-dev --https-port=8443
          volumeMounts:
            - {name: data, mountPath: /opt/keycloak/data}
          # Podman macht aus livenessProbe/exec einen echten Container-Healthcheck (`podman ps`
          # zeigt "healthy"); Werte wie in compose.yml.
          livenessProbe:
            exec:
              command: ["sh", "-c", "java /opt/keycloak/healthcheck/JwksHealthCheck.java >/dev/null 2>&1"]
            initialDelaySeconds: 5
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 150
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: dpop-kube-keycloak-data}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
spec:
  replicas: 1
  selector: {matchLabels: {app: orchestrator}}
  template:
    metadata:
      labels: {app: orchestrator}
    spec:
      # Ersatz fuer depends_on/service_healthy: laeuft vor dem Orchestrator-Container und endet
      # erst, wenn Keycloaks JWKS antwortet. Nimmt das Keycloak-Image, weil nur dort der
      # Healthcheck (und ein JDK) liegt.
      initContainers:
        - name: wait-for-keycloak
          image: localhost/dpop-demo-kube-keycloak:latest
          imagePullPolicy: Never
          command: ["sh", "-c"]
          args:
            - |
              until java /opt/keycloak/healthcheck/JwksHealthCheck.java https://keycloak:8443 >/dev/null 2>&1; do
                echo "warte auf keycloak..."; sleep 2
              done
      containers:
        - name: orchestrator
          image: localhost/dpop-demo-kube-orchestrator:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
              hostPort: 8090
          env:
            - {name: SPRING_PROFILES_ACTIVE, value: keycloak}
            - {name: SPRING_DATASOURCE_URL, value: 'jdbc:h2:file:/data/dpopdb'}
            - {name: KEYCLOAK_SETUP_VARIANT, value: kube}
            - name: KEYCLOAK_ADMIN
              valueFrom: {secretKeyRef: {name: dpop-kube-keycloak-admin, key: username}}
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: dpop-kube-keycloak-admin, key: password}}
          volumeMounts:
            - {name: data, mountPath: /data}
          livenessProbe:
            exec:
              command: ["bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET / HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q 200"]
            initialDelaySeconds: 10
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 60
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: dpop-kube-orchestrator-data}
